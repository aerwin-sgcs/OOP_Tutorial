<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Creation — Build Ironwall</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<style>
  :root{
    --bg:#303c4e; --bg2:#242e3e; --card:#3a485c; --ink:#eaf0f8;
    --ink-dim:#a0b2c8; --green:#d0a05c; --green-dark:#aa783c; --border:#4a5a70;
    --code-bg:#26303f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Exo 2',sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;}
  .layout{display:flex;max-width:1180px;margin:0 auto;}
  /* sidebar */
  .sidebar{width:240px;flex-shrink:0;padding:24px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar .brand{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:var(--green);margin-bottom:4px;}
  .sidebar .brand-sub{font-family:'Orbitron',sans-serif;font-size:0.62rem;letter-spacing:2px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:20px;}
  .sidebar-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;transition:background .12s;}
  .sidebar-item:hover{background:rgba(208,160,92,.12);}
  .sidebar-item.active{background:rgba(208,160,92,.20);}
  .sidebar-item.visited .sidebar-num{background:var(--green);color:#2a2012;}
  .sidebar-num{width:26px;height:26px;border-radius:50%;background:#2a3445;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:.8rem;flex-shrink:0;}
  .sidebar-item.active .sidebar-num{background:var(--green);color:#2a2012;}
  .sidebar-title{font-weight:600;font-size:.9rem;line-height:1.2;}
  .sidebar-sub{font-size:.72rem;color:var(--ink-dim);}
  .back-to-menu{display:inline-block;margin-top:18px;font-family:'Orbitron',sans-serif;font-size:.72rem;letter-spacing:1px;text-decoration:none;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:8px 12px;}
  .back-to-menu:hover{background:var(--green);color:#2a2012;}
  /* main */
  main{flex:1;padding:30px 36px 80px;min-width:0;}
  .page-tag{font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:2px;color:var(--green);text-transform:uppercase;}
  .page-title{font-family:'Cinzel Decorative',serif;font-size:2.4rem;margin:6px 0 4px;}
  .page-subtitle{color:var(--ink-dim);font-size:1.05rem;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px 26px;margin-bottom:20px;box-shadow:0 3px 12px rgba(40,60,90,.07);}
  .card-heading{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.5px;color:var(--green);margin-bottom:12px;}
  .card p{line-height:1.65;margin-bottom:10px;}
  .card a{color:#7ecb8f;font-weight:600;}
  .card a:hover{color:#a8e8b8;}
  /* peek button and hidden code panel */
  .peek-wrap{margin:12px 0;}
  .peek-btn{font-family:'Orbitron',sans-serif;font-size:.66rem;letter-spacing:1.5px;background:transparent;color:#7ecb8f;border:2px solid #7ecb8f;border-radius:20px;padding:6px 18px;cursor:pointer;transition:all .15s;}
  .peek-btn:hover{background:#7ecb8f;color:#1a2a1a;}
  .peek-btn.used{color:var(--ink-dim);border-color:var(--border);cursor:default;}
  .peek-code{display:none;margin-top:10px;}
  .peek-code.visible{display:block;}
  code{font-family:'Share Tech Mono',monospace;background:var(--code-bg);padding:2px 6px;border-radius:4px;color:#e6b87a;font-size:.92em;}
  .callout{background:rgba(208,160,92,.12);border-left:4px solid var(--green);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;line-height:1.6;}
  .highlight{background:#2a3445;border:1px dashed var(--border);border-radius:8px;padding:14px 16px;margin:12px 0;line-height:1.8;font-family:'Share Tech Mono',monospace;font-size:.9rem;}
  /* build step */
  .build-card{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--green);border-radius:12px;padding:20px 24px;margin-bottom:20px;box-shadow:0 3px 12px rgba(40,60,90,.07);}
  .build-badge{display:inline-block;font-family:'Orbitron',sans-serif;font-size:.66rem;letter-spacing:1.5px;background:var(--green);color:#2a2012;padding:4px 10px;border-radius:20px;margin-bottom:10px;}
  .build-heading{font-family:'Orbitron',sans-serif;font-size:1.05rem;margin-bottom:8px;}
  .build-instruction{margin-bottom:12px;line-height:1.6;}
  .code-wrap{position:relative;margin:12px 0;}
  pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto;}
  pre code{background:none;padding:0;color:#d8e2ee;font-size:.86rem;line-height:1.5;}
  .copy-btn{position:absolute;top:8px;right:8px;font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:1px;background:var(--green);color:#2a2012;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;opacity:.9;}
  .copy-btn:hover{opacity:1;}
  .expected{background:#1b2330;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;}
  .expected-label{font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:1px;color:#e6c189;margin-bottom:6px;}
  .expected pre{background:none;border:none;padding:0;color:#d3deea;font-family:'Share Tech Mono',monospace;font-size:.82rem;white-space:pre-wrap;}
  .explain-table{width:100%;border-collapse:collapse;margin-top:12px;}
  .explain-table td{border:1px solid var(--border);padding:8px 10px;vertical-align:top;font-size:.86rem;line-height:1.5;}
  .explain-table td:first-child{font-family:'Share Tech Mono',monospace;background:var(--code-bg);color:#0b6;white-space:nowrap;}
  .note-box{background:#3a3320;border:1px solid #6a5a2a;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:.9rem;line-height:1.5;color:#f0e2c4;}
  .terms-table{width:100%;border-collapse:collapse;}
  .terms-table th{background:var(--green);color:#2a2012;font-family:'Orbitron',sans-serif;font-size:.7rem;letter-spacing:1px;padding:8px 10px;text-align:left;}
  .terms-table td{border:1px solid var(--border);padding:8px 10px;font-size:.88rem;line-height:1.5;}
  .terms-table td:first-child{font-weight:600;width:30%;}
  /* diagram */
  .tree{font-family:'Share Tech Mono',monospace;text-align:center;margin:8px 0;}
  .tree .node{display:inline-block;background:var(--green);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;margin:4px;}
  .tree .mid{background:#5a7088;}
  .tree .leaf{background:#46566c;color:var(--ink);border:2px solid var(--green);}
  .tree .row{margin:6px 0;}
  .tree .connector{color:var(--ink-dim);font-size:1.1rem;}
  /* download */
  .download{background:linear-gradient(135deg,#d0a05c,#aa783c);color:#2a2012;border-radius:14px;padding:24px;text-align:center;margin-bottom:22px;}
  .download .dl-title{font-family:'Cinzel Decorative',serif;font-size:1.4rem;margin-bottom:6px;}
  .download p{margin-bottom:14px;opacity:.95;}
  .btn-download{display:inline-block;font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:1px;background:#fff;color:var(--green-dark);text-decoration:none;padding:12px 24px;border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.2);}
  .btn-download:hover{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2);}
  /* nav */
  .nav-buttons{display:flex;justify-content:space-between;margin-top:24px;}
  .btn-nav{font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:1px;background:var(--green);color:#2a2012;border:none;border-radius:8px;padding:12px 22px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:700;}
  .btn-nav:hover{background:var(--green-dark);color:#fff;}
  @media(max-width:820px){.sidebar{display:none;} main{padding:20px;}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Game Creation</div>
    <div class="brand-sub">Build Ironwall</div>
    <div id="sidebar"></div>
    <a class="back-to-menu" href="index.html">&lt; ← MENU &gt;</a>
  </aside>
  <main id="mainContent"></main>
</div>

<script src="game_creation.js"></script>
<script>
let currentPage = 0;
const visited = new Set();

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildSidebar(){
  document.getElementById('sidebar').innerHTML = TUTORIAL.pages.map((p,i)=>`
    <div class="sidebar-item" id="sb${i}" onclick="goToPage(${i})">
      <div class="sidebar-num">${i+1}</div>
      <div><div class="sidebar-title">${p.title}</div><div class="sidebar-sub">${p.tag||''}</div></div>
    </div>`).join('');
}
function updateSidebar(){
  TUTORIAL.pages.forEach((p,i)=>{
    document.getElementById('sb'+i).className='sidebar-item'+(i===currentPage?' active':visited.has(i)?' visited':'');
  });
}
function goToPage(n){visited.add(currentPage);currentPage=n;render();window.scrollTo({top:0,behavior:'smooth'});}

function codeBlock(code){
  const id='cb_'+Math.random().toString(36).slice(2);
  return `<div class="code-wrap"><pre><code class="language-python" id="${id}">${escHtml(code)}</code></pre>
    <button class="copy-btn" onclick="copyCode('${id}',this)">COPY</button></div>`;
}
function peekBlock(code){
  const id='pk_'+Math.random().toString(36).slice(2);
  const bid='pkb_'+Math.random().toString(36).slice(2);
  return `<div class="peek-wrap">
    <button class="peek-btn" id="${bid}" onclick="showPeek('${id}','${bid}')">👀 Take a peek</button>
    <div class="peek-code" id="${id}">${codeBlock(code)}</div>
  </div>`;
}
function showPeek(codeId, btnId){
  document.getElementById(codeId).classList.add('visible');
  const btn=document.getElementById(btnId);
  btn.textContent='Code shown';
  btn.classList.add('used');
  btn.disabled=true;
  document.querySelectorAll('#'+codeId+' pre code').forEach(el=>hljs.highlightElement(el));
}
function copyCode(id,btn){navigator.clipboard.writeText(document.getElementById(id).textContent);btn.textContent='COPIED';setTimeout(()=>btn.textContent='COPY',1200);}

function renderSection(s){
  if(s.type==='terms'){
    const rows=s.terms.map(t=>`<tr><td>${escHtml(t.term)}</td><td>${t.definition}</td></tr>`).join('');
    return `<div class="card"><div class="card-heading">${s.heading}</div>
      <table class="terms-table"><tr><th>TERM</th><th>WHAT IT MEANS</th></tr>${rows}</table></div>`;
  }
  if(s.type==='build'){
    let h=`<div class="build-card"><div class="build-badge">⌨ ${s.badge||'CODING STEP'}</div>
      <div class="build-heading">${s.heading}</div><div class="build-instruction">${s.instruction}</div>`;
    if(s.code) h+= s.peek ? peekBlock(s.code) : codeBlock(s.code);
    if(s.expectedOutput) h+=`<div class="expected"><div class="expected-label">▶ EXPECTED OUTPUT</div><pre>${escHtml(s.expectedOutput)}</pre></div>`;
    if(s.explain){h+=`<table class="explain-table">`+s.explain.map(e=>`<tr><td>${escHtml(e.line)}</td><td>${e.explain}</td></tr>`).join('')+`</table>`;}
    if(s.note) h+=`<div class="note-box">📌 ${s.note}</div>`;
    h+=`</div>`;return h;
  }
  // default info card
  let h=`<div class="card">`;
  if(s.heading) h+=`<div class="card-heading">${s.heading}</div>`;
  if(s.content) h+=`<div>${s.content}</div>`;
  if(s.diagram) h+=s.diagram;
  if(s.highlight) h+=`<div class="highlight">${s.highlight}</div>`;
  if(s.callout) h+=`<div class="callout">${s.callout}</div>`;
  if(s.content2) h+=`<div>${s.content2}</div>`;
  if(s.code) h+=codeBlock(s.code);
  h+=`</div>`;return h;
}

function render(){
  const p=TUTORIAL.pages[currentPage];
  let html=`<div class="page-tag">PAGE ${currentPage+1} OF ${TUTORIAL.pages.length} · ${TUTORIAL.title.toUpperCase()}</div>
    <h1 class="page-title">${p.title}</h1><p class="page-subtitle">${p.subtitle}</p>`;
  if(p.download) html+=`<div class="download"><div class="dl-title">${p.download.title}</div>
    <p>${p.download.desc}</p><a class="btn-download" href="${p.download.href}" download>⬇ ${p.download.label}</a></div>`;
  (p.sections||[]).forEach(s=>html+=renderSection(s));
  html+=`<div class="nav-buttons">`;
  html+= currentPage>0?`<button class="btn-nav" onclick="goToPage(${currentPage-1})">← PREVIOUS</button>`:`<span></span>`;
  html+= currentPage<TUTORIAL.pages.length-1?`<button class="btn-nav" onclick="goToPage(${currentPage+1})">NEXT →</button>`:`<a class="btn-nav" href="ironwall.html">PLAY IRONWALL →</a>`;
  html+=`</div>`;
  document.getElementById('mainContent').innerHTML=html;
  document.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  updateSidebar();
}
buildSidebar();render();
</script>
</body>
</html>
